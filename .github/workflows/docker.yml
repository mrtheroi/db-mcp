name: docker

# Pull requests and pushes to main: build the image and smoke test it (nothing
# is pushed). A pushed release tag (vX.Y.Z): build, smoke test the amd64 image,
# then publish the multi-arch image to ghcr.io/<owner>/memry-server.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

# Branch and PR runs cancel superseded runs. Tag publishes share one group and
# never cancel a run in progress, so they are serialized.
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/v') && 'docker-publish' || format('docker-{0}', github.ref) }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build-and-smoke:
    name: Build image and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Tag publishes need every tag to decide whether this one is latest.
          fetch-depth: ${{ env.PUBLISH == 'true' && '0' || '1' }}

      - name: Set up QEMU (arm64 build)
        if: env.PUBLISH == 'true'
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: memry-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        env:
          SKIP_BUILD: "1"
          MEMRY_IMAGE: memry-server:ci
        run: docker/smoke.sh

      # `latest` moves only when this tag is the highest stable vX.Y.Z tag, so an
      # out-of-order or backport tag cannot overwrite it.
      - name: Decide whether this tag is latest
        if: env.PUBLISH == 'true'
        id: latest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          highest="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [ -n "$highest" ] && [ "$TAG" = "$highest" ]; then
            is_latest=true
          else
            is_latest=false
          fi
          echo "highest stable tag: ${highest:-none}, this tag: ${TAG}, latest: ${is_latest}"
          echo "is_latest=${is_latest}" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        if: env.PUBLISH == 'true'
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.latest.outputs.is_latest }}
          labels: |
            org.opencontainers.image.title=memry-server
            org.opencontainers.image.description=memry Community, the self-hosted memry MCP memory server
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.title=memry-server
            org.opencontainers.image.description=memry Community, the self-hosted memry MCP memory server
            org.opencontainers.image.licenses=MIT

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only reached when the smoke test passed. The amd64 layers come from the
      # build above via the gha cache; arm64 is built under QEMU.
      - name: Build and push multi-arch image
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
