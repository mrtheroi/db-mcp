name: docker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: Build image and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: memry-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        env:
          SKIP_BUILD: "1"
          MEMRY_IMAGE: memry-server:ci
        run: docker/smoke.sh
